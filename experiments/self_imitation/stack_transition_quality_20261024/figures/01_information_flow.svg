   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #657785" x="381.06" y="87.89087" transform="rotate(-0 381.06 87.89087)">Geplanter Datenfluss · jeder Datensatz behält seine Teacher- und Episodenherkunft</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #226b94" x="381.06" y="144.279135" transform="rotate(-0 381.06 144.279135)">Geloggter Teacher-Rollout</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(253.772109 159.758605)">Vor jeder Aktion beobachten → Aktion ausführen</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(292.380938 174.458605)">→ vollständigen Verlauf speichern</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #226b94" x="135.380571" y="246.722613" transform="rotate(-0 135.380571 246.722613)">Zustand vor der Aktion</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(78.157212 262.617161)">Greifer, Quelle, Phase</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(54.230337 277.91927)">Arm C zusätzlich: unterer Turm</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #287c72" x="381.06" y="246.806988" transform="rotate(-0 381.06 246.806988)">Ausgeführte Aktion</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(299.478281 262.202083)">Tatsächliche Teacherbewegung</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(335.054414 277.91927)">und Greiferaktion</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #81549c" x="626.739429" y="247.727613" transform="rotate(-0 626.739429 247.727613)">Späterer Übergangsverlauf</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(557.929155 262.202083)">Turmerhalt, Verschiebung,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(550.64478 277.383606)">Kontakte, nächste Aufnahme</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #226b94" x="135.380571" y="351.727178" transform="rotate(-0 135.380571 351.727178)">Student bekommt s(t)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(53.79311 367.206648)">Nur jetzt beobachtbare Größen</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(60.794478 381.906648)">→ eigene Aktionsvorhersage</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #287c72" x="381.06" y="351.727178" transform="rotate(-0 381.06 351.727178)">Imitationsziel a(t)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(308.682188 368.223836)">Aktion wird nicht durch den</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(300.931055 381.906648)">Qualitätsscore umgeschrieben</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #81549c" x="626.739429" y="351.811553" transform="rotate(-0 626.739429 351.811553)">Gültigkeit + Gewicht g</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(558.733882 367.206648)">Rückblickende Bewertung</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243443" transform="translate(565.941968 381.906648)">ändert den Lernbeitrag</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #287c72" x="381.06" y="459.29283" transform="rotate(-0 381.06 459.29283)">Gewichtetes Behavior Cloning → neues Modell</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243443" x="381.06" y="482.1223" transform="rotate(-0 381.06 482.1223)">Lernt, ausgewählte Teacheraktionen aus aktuellen Zuständen vorherzusagen</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #81549c" transform="translate(210.468047 535.585399)">Kein Informationspfad von späterer Stabilität zum Policyinput.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #81549c" transform="translate(201.059609 552.085399)">Ein gutes Gewicht ist keine neue oder korrigierte Expertenaktion.</text>
   </g>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243443" x="369" y="19.5825" transform="rotate(-0 369 19.5825)">Informationsübertrag: sichere Handlungen lernen, Zukunftswissen trennen</text>
