# Publishes sites/atlas-pages (the public project site) to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Site URL: https://arturkueck.github.io/Imitation-Learning/
name: Deploy project site

on:
  push:
    branches: [main]
    paths:
      - "sites/atlas-pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: sites/atlas-pages
          lfs: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/atlas-pages
      - id: deployment
        uses: actions/deploy-pages@v4
